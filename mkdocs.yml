site_name: Kiran's Interview Preparation
site_url: https://kiran7007.github.io/Interview-Preparation/
site_description: Android, Kotlin and Software Engineering Interview Preparation

theme:
  name: material

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Android: android.md

  - Career: career.md

  - Cross-platform: cross-platform.md

  - DSA: dsa.md

  - Java: java.md

  - Kotlin: kotlin.md

  - System Design: system-design.md

extra_css:
  - stylesheets/extra.css

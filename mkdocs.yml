site_name: Kiran's Interview Preparation
site_description: Android, Kotlin and Software Engineering Interview Preparation

theme:
  name: material

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - Android:
      - Android: android.md

  - Kotlin:
      - Kotlin: kotlin.md

  - Coroutines:
      - Coroutines: coroutines.md

  - Flow:
      - Flow: flow.md

  - Jetpack Compose:
      - Compose: compose.md

  - Architecture:
      - Architecture: architecture.md

  - Testing:
      - Testing: testing.md

  - System Design:
      - System Design: system-design.md

extra_css:
  - stylesheets/extra.css

site_name: Kiran's Interview Preparation
site_url: https://kiran7007.github.io/Interview-Preparation/
site_description: Android, Kotlin and Software Engineering Interview Preparation

hooks:
  - hooks.py

theme:
  name: material

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html

  - toc:
      permalink: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Android: android.md
  - Java: java.md
  - Kotlin: kotlin.md
  - Career: career.md
  - Cross-platform: cross-platform.md
  - DSA: dsa.md
  - System Design: system-design.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation.js